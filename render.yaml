# Render Blueprint Configuration for NWO Portal
# Reference: https://render.com/docs/blueprints

databases:
  - name: ofcnet_db
    databaseName: ofcnet
    user: ofcnet_user
    plan: free

services:
  - type: web
    name: nwo-portal
    runtime: python
    plan: free
    
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ofcnet_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: USE_GIS
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
