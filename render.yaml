# Render Blueprint Configuration for OFCNetTracker
# Reference: https://render.com/docs/blueprints

databases:
  - name: ofcnet_db
    databaseName: ofcnet
    user: ofcnet_user
    plan: free # Use the free database plan

services:
  - type: web
    name: ofc-net-tracker
    runtime: python
    plan: free
    
    # Build Command: Runs during build, executes the root build.sh script
    buildCommand: "bash build.sh"
    
    # Start Command: Run migrations at startup and launch Gunicorn.
    # Render free tier does not support pre-deploy commands.
    startCommand: "bash start.sh"
    
    envVars:
      # Automatically connect the database created above
      - key: DATABASE_URL
        fromDatabase:
          name: ofcnet_db
          property: connectionString
          
      # Django environment configurations
      - key: SECRET_KEY
        generateValue: true # Render will automatically generate a secure 50-character random key
        
      - key: DEBUG
        value: "False" # Production security: Set to False
        
      - key: ALLOWED_HOSTS
        value: "*" # Allow Render domains to access the site
        
      - key: USE_GIS
        value: "False" # Standard SQLite/Postgres native setup (GeoDjango requires heavy system packages)
        
      - key: PYTHON_VERSION
        value: "3.11.9" # Match active Python version
