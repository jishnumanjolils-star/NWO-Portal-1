{% extends 'inventory/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Rate Master - NET-TRACKER{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-premium shadow-lg border-0 animate-fade">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0"><i class="bi bi-currency-rupee me-2"></i>Configure New Unit Rate</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-5">Save Rate</button>
                            <a href="{% url 'oh_rate_master_list' %}" class="btn btn-light px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
